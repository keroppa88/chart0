name: Collect Japan Markets
on:
  workflow_dispatch:
  repository_dispatch:
    types: [scheduled-collect-jp]
permissions:
  contents: write
concurrency:
  group: chart0-data-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install browser
        working-directory: collector
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Collect, format, and update chart CSVs
        run: xvfb-run -a node collector/run.cjs jp
      - name: Save data
        run: bash collector/save-data.sh jp
      - name: Report incomplete collection
        run: |
          node -e 'const r=require("./collector-result.json"); if(r.errors.length) { console.error(r.errors.join("\n")); process.exit(1); }'
