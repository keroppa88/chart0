name: Daily Update
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/daily_update.yml'
  schedule:
    - cron: '40 7 * * 1-5' # 日本時間16:40（UTC 7:40）
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '取得する過去日数（欠損補修時に大きくする。例: 16）'
        required: false
        default: '5'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      # 株価データ更新
      - name: Update Stock Data
        run: node update_daily.js
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '5' }}

     
      # 財務情報更新
      - name: Update Finance Data
        run: node update_f_daily.js
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          BACKFILL_DAYS: ${{ inputs.backfill_days || '5' }}

      # コミット＆プッシュ
      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv financedata/*.csv
          git diff --cached --name-only
          git commit -m "Update $(date +'%Y-%m-%d')" || exit 0
          git push
