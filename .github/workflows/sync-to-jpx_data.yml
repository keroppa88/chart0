name: Sync pricedata to jpx_data
# 主要株価指数CSVに変化があると jpx_data リポジトリの data/ に反映する。
# make.yml / make_usa.yml のGitHub Actionsコミットではpushトリガーが
# 発動しないため workflow_run で明示的にトリガーする。
on:
  workflow_run:
    workflows: ["Collect Japan Markets", "Collect Overseas Markets"]
    types: [completed]
  push:
    branches: [ main ]
    paths:
      - 'collector/data/pricedata/TOPIX (東証株価指数).csv'
      - 'collector/data/pricedata/TOPIX Core30.csv'
      - 'collector/data/pricedata/TOPIX Large70.csv'
      - 'collector/data/pricedata/TOPIX Mid400.csv'
      - 'collector/data/pricedata/TOPIX Small.csv'
      - 'collector/data/pricedata/TOPIX グロース.csv'
      - 'collector/data/pricedata/TOPIX バリュー.csv'
      - 'collector/data/pricedata/プライム時価総額（兆円）.csv'
      - 'collector/data/pricedata/プライム売買代金（兆円）.csv'
      - 'collector/data/pricedata/先導株比率10位.csv'
      - 'collector/data/pricedata/先導株比率1～3位.csv'
      - 'collector/data/pricedata/先導株比率20位.csv'
      - 'collector/data/pricedata/先導株比率30位.csv'
      - 'collector/data/pricedata/先導株比率40位.csv'
      - 'collector/data/pricedata/先導株比率50位.csv'
      - 'collector/data/pricedata/日経半導体株指数.csv'
      - 'collector/data/pricedata/日経平均時価総額.csv'
      - 'collector/data/pricedata/日経平均株価.csv'
      - 'collector/data/pricedata/NYダウ.csv'
      - 'collector/data/pricedata/SOX指数.csv'
      - 'collector/data/pricedata/S&P500.csv'
      - 'collector/data/pricedata/ナスダック.csv'

  workflow_dispatch:

defaults:
  run:
    working-directory: collector
concurrency:
  group: sync-jpx-data
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    # workflow_runトリガーの場合は成功時のみ実行
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout get
        uses: actions/checkout@v4

      - name: Clone jpx_data
        run: |
          git clone https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/keroppa88/jpx_data.git jpx_data

      - name: Copy CSV files
        run: |
          mkdir -p jpx_data/data
          while IFS= read -r raw; do
            # YAMLインデント由来の先頭空白を除去
            name="${raw#"${raw%%[![:space:]]*}"}"
            [ -z "$name" ] && continue
            cp -f "data/pricedata/$name.csv" "jpx_data/data/$name.csv"
          done <<'LIST'
          TOPIX (東証株価指数)
          TOPIX Core30
          TOPIX Large70
          TOPIX Mid400
          TOPIX Small
          TOPIX グロース
          TOPIX バリュー
          プライム時価総額（兆円）
          プライム売買代金（兆円）
          先導株比率10位
          先導株比率1～3位
          先導株比率20位
          先導株比率30位
          先導株比率40位
          先導株比率50位
          日経半導体株指数
          日経平均時価総額
          日経平均株価
          NYダウ
          SOX指数
          S&P500
          ナスダック
          LIST

      - name: Commit & push if changed
        run: |
          cd jpx_data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git status --porcelain | grep -q .; then
            git add data/
            git commit -m "sync: pricedata from get [skip ci]"
            git push
          else
            echo "No changes; skip."
          fi
