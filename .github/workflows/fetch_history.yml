name: Fetch History (指定銘柄の全履歴取得)
on:
  workflow_dispatch:
    inputs:
      codes:
        description: '取得する銘柄コード（カンマ区切り。例: 74850,12340 ※API用5桁。4桁でも自動で末尾0を補完）'
        required: true
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Stock History
        run: node sometime/get_codes.js
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          CODES: ${{ inputs.codes }}

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.csv
          git diff --cached --name-only
          git commit -m "Fetch history: ${{ inputs.codes }}" || exit 0
          git push
